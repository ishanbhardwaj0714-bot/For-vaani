<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Vaani ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0; min-height:100vh; overflow:hidden;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:linear-gradient(135deg,#fff0f5,#ffe1ec,#f8d9ff);
 display:flex; align-items:center; justify-content:center; color:#4b1830;
}
.card{
 width:min(92%,430px); padding:32px 24px; text-align:center;
 background:rgba(255,255,255,.72); backdrop-filter:blur(14px);
 border:1px solid rgba(255,255,255,.9); border-radius:28px;
 box-shadow:0 18px 60px rgba(130,45,90,.18);
 position:relative; z-index:2;
}
.heart{font-size:54px; animation:pulse 1.3s infinite}
h1{font-size:31px;margin:8px 0 12px}
p{font-size:17px;line-height:1.55;margin:10px 0}
.small{font-size:14px;opacity:.7}
button{
 border:0;border-radius:999px;padding:14px 25px;margin:8px;
 font-size:16px;font-weight:700;cursor:pointer;transition:.2s;
}
.yes{background:#ff4f87;color:white;box-shadow:0 8px 20px #ff4f8755}
.no{background:#fff;color:#a33a63;border:1px solid #ffc2d5}
button:hover{transform:scale(1.05)}
.hidden{display:none}
.letter{text-align:left;background:#fff8fb;border-radius:18px;padding:18px;margin:18px 0}
.floating{
 position:absolute; font-size:22px; opacity:.65; animation:float 7s linear infinite;
}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes float{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
.confetti{position:fixed;width:9px;height:15px;top:-20px;z-index:5;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="floating" style="left:8%;animation-delay:0s">♡</div>
<div class="floating" style="left:25%;animation-delay:2s">♥</div>
<div class="floating" style="left:75%;animation-delay:1s">♡</div>
<div class="floating" style="left:90%;animation-delay:3s">♥</div>

<div class="card" id="card">
  <div class="heart">💗</div>
  <div class="small">A little something from Ishan</div>
  <h1>Hey Vaani…</h1>
  <p>I have a tiny question for you.<br>But please don't answer too quickly 👀</p>
  <button class="yes" onclick="nextPage()">Open it 💌</button>
</div>

<script>
function nextPage(){
 document.getElementById("card").innerHTML=`
   <div class="heart">🥹❤️</div>
   <h1>Vaani,</h1>
   <div class="letter">
    <p>Some people just become special without even trying.</p>
    <p>And somehow, you became that person for me.</p>
    <p>So Ishan has one very important question to ask you…</p>
   </div>
   <p><b>Will you be mine? ❤️</b></p>
   <button class="yes" onclick="yes()">YES, I WILL 💗</button>
   <button class="no" id="no" onclick="moveNo()">Let me think 🙈</button>
 `;
}
function moveNo(){
 const b=document.getElementById("no");
 b.style.position="fixed";
 b.style.left=Math.random()*65+15+"%";
 b.style.top=Math.random()*65+20+"%";
}
function yes(){
 document.getElementById("card").innerHTML=`
   <div class="heart">💖</div>
   <h1>YAYYY, Vaani! 🥹❤️</h1>
   <p>You just made Ishan the happiest person.</p>
   <p><b>Officially us? 🫶</b></p>
   <p class="small">Made with love, just for you.</p>
 `;
 for(let i=0;i<90;i++){
   const c=document.createElement("div"); c.className="confetti";
   c.style.left=Math.random()*100+"vw";
   c.style.animationDelay=Math.random()*1.2+"s";
   c.style.transform="rotate("+Math.random()*360+"deg)";
   c.innerHTML=["❤️","💗","💖","✨","💕"][Math.floor(Math.random()*5)];
   document.body.appendChild(c);
 }
}
</script>
</body>
</html>
